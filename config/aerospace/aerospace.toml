config-version = 2

after-startup-command = []

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '~/.config/aerospace/floating-logic.sh',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7"]

[workspace-to-monitor-force-assignment]
2 = ["DELL", "secondary"]
3 = ["main", "Built-in Retina Display"]

on-mode-changed = []

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-g = 'fullscreen'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-l = 'move right'
alt-shift-k = 'move-workspace-to-monitor secondary'
alt-shift-j = 'move-workspace-to-monitor "Built-in Retina Display"'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-m = 'workspace 1 --fail-if-noop'
alt-n = 'workspace 2 --fail-if-noop'
alt-o = 'workspace 3 --fail-if-noop'
alt-p = 'workspace 4 --fail-if-noop'
alt-q = 'workspace 5 --fail-if-noop'
alt-r = 'workspace 6 --fail-if-noop'
alt-s = 'workspace 7 --fail-if-noop'

alt-shift-m = 'move-node-to-workspace 1'
alt-shift-n = 'move-node-to-workspace 2'
alt-shift-o = 'move-node-to-workspace 3'
alt-shift-p = 'move-node-to-workspace 4'
alt-shift-q = 'move-node-to-workspace 5'
alt-shift-r = 'move-node-to-workspace 6'
alt-shift-s = 'move-node-to-workspace 7'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# === Workspace 1: Browsers ===
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 1'

# === Workspace 2: Coding ===
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'dev.kiro.desktop'
run = 'move-node-to-workspace 2'

# === Workspace 3: Terminal ===
[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'move-node-to-workspace 3'

# === Workspace 4: Messaging ===
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 4'

# === Workspace 5: Meetings & Docs ===
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace 5'

# === Workspace 6: Calendar ===
[[on-window-detected]]
if.app-name-regex-substring = 'calendar'
run = 'move-node-to-workspace 6'

# === Workspace 7: Misc ===
[[on-window-detected]]
if.app-name-regex-substring = 'YouTube Music'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.usebruno.app'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-id = 'com.microsoft.Excel'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-name-regex-substring = 'Preview'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-name-regex-substring = 'Flow'
run = 'move-node-to-workspace 7'

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'move-node-to-workspace 7'
