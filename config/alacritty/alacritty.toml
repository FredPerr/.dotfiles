[font]
size = 12

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[window]
opacity = 0.90
decorations = "Full"
startup_mode = "Windowed"
dynamic_padding = true
padding = { x = 5, y = 5 }

[terminal.shell]
program = "/opt/homebrew/bin/tmux"
